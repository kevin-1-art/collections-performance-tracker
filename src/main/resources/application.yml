server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/collections}
    username: ${DB_USER:collections}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/postgresql}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  jwt-secret: ${JWT_SECRET:}
  import-service-url: ${IMPORT_SERVICE_URL:http://localhost:8000}
  bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-admin-display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:System Administrator}

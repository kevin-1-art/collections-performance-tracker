services:
  - type: web
    name: collections-performance-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collections-tracker-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: collections-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: collections-tracker-db
          property: password
      - key: IMPORT_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: collections-tracker-import
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_DISPLAY_NAME
        value: System Administrator

  - type: pserv
    name: collections-tracker-import
    runtime: docker
    dockerfilePath: ./import-service/Dockerfile
    dockerContext: ./import-service

databases:
  - name: collections-tracker-db
    databaseName: collections
    user: collections
    postgresMajorVersion: "16"
